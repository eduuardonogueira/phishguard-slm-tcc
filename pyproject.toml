[project]
name = "phishguard-slm"
version = "1.0.0"
description = "Detecção de phishing em URLs brasileiras com modelos de linguagem pequenos (SLMs): código de reprodução do TCC (UFRA, 2026)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Eduardo Nogueira" }]
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.11",
    "accelerate>=0.30",
    "datasets>=2.19",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pandas>=2.2",
    "numpy>=1.26",
    "xgboost>=3.2.0",
    "typer>=0.12",
    "rich>=13.7",
    "flask>=3.0",
    "flask-cors>=4.0",
    "psutil>=5.9",
    "requests>=2.31",
    "python-whois>=0.9.6",
    "python-dotenv>=1.2.2",
    "tldextract==5.4.0",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
figuras = ["matplotlib>=3.8", "fonttools<4.69"]

[project.scripts]
phishguard = "phishguard_slm.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
